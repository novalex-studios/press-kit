<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Novalex Studios — Press Kits</title>
		<meta
			name="description"
			content="Press kits for Novalex Studios games — fact sheets, screenshots, logos and downloadable asset packs."
		/>
		<meta name="robots" content="noindex" />
		<style>
			:root {
				color-scheme: dark;
				--bg: #16181c;
				--fg: #e8e6e3;
				--muted: #9aa0a6;
				--rule: #2c3036;
			}
			body {
				margin: 0;
				padding: 4rem 1.5rem;
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, sans-serif;
				line-height: 1.6;
			}
			main {
				max-width: 34rem;
				margin: 0 auto;
			}
			h1 {
				font-size: 1.5rem;
				margin: 0 0 0.5rem;
			}
			p {
				color: var(--muted);
			}
			hr {
				border: 0;
				border-top: 1px solid var(--rule);
				margin: 2rem 0;
			}
			a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Novalex Studios — Press Kits</h1>
			<p>This site is being set up. Press kits will be published here shortly.</p>
			<hr />
			<p>
				Press enquiries:
				<a href="mailto:studios.novalex@gmail.com">studios.novalex@gmail.com</a>
			</p>
		</main>
	</body>
</html>
